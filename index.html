<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>鸣潮 · 共鸣者人格测试</title>
<style>
  :root {
    --bg: #05070d;
    --bg2: #0a0f1c;
    --panel: rgba(18, 24, 40, 0.72);
    --panel-border: rgba(103, 232, 249, 0.18);
    --text: #e6f1ff;
    --muted: #8b9bb8;
    --accent: #22d3ee;
    --accent2: #a78bfa;
    --glow: rgba(34, 211, 238, 0.45);
    --radius: 18px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--text);
    background:
      radial-gradient(1200px 700px at 80% -10%, rgba(167, 139, 250, 0.16), transparent 60%),
      radial-gradient(1000px 700px at -10% 110%, rgba(34, 211, 238, 0.14), transparent 55%),
      linear-gradient(160deg, var(--bg) 0%, var(--bg2) 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    -webkit-font-smoothing: antialiased;
  }

  /* 科幻网格背景 */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(103, 232, 249, 0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(103, 232, 249, 0.045) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
    pointer-events: none;
    z-index: 0;
  }

  #app {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 620px;
  }

  .screen { display: none; animation: fadeUp 0.5s ease; }
  .screen.active { display: block; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.04);
    padding: clamp(24px, 5vw, 40px);
  }

  /* ---------- 开始页 ---------- */
  .hero {
    text-align: center;
    padding-top: 8px;
  }
  .hero .mark {
    width: 64px; height: 64px; margin: 0 auto 20px;
    border-radius: 18px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 30px;
    box-shadow: 0 0 30px var(--glow);
  }
  .hero h1 {
    font-size: clamp(26px, 6vw, 38px);
    letter-spacing: 2px;
    background: linear-gradient(90deg, #67e8f9, #a78bfa);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 12px;
  }
  .hero .sub {
    color: var(--muted);
    font-size: 15px;
    line-height: 1.7;
    margin-bottom: 28px;
  }
  .hero .meta {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 30px;
    letter-spacing: 1px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 34px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 2px;
    color: #041018;
    background: linear-gradient(135deg, #67e8f9, #38bdf8);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.2s ease;
    box-shadow: 0 0 24px var(--glow);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 0 34px var(--glow); }
  .btn:active { transform: translateY(0); }
  .btn.ghost {
    color: var(--text);
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--panel-border);
    box-shadow: none;
  }

  /* ---------- 答题页 ---------- */
  .progress-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    font-size: 13px;
    color: var(--muted);
  }
  .progress-head b { color: var(--accent); }
  .bar {
    height: 6px;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    overflow: hidden;
    margin-bottom: 26px;
  }
  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 999px;
    transition: width 0.4s ease;
    box-shadow: 0 0 12px var(--glow);
  }
  .q-text {
    font-size: clamp(19px, 4.5vw, 24px);
    font-weight: 600;
    line-height: 1.5;
    margin-bottom: 24px;
  }
  .options { display: flex; flex-direction: column; gap: 12px; }
  .option {
    text-align: left;
    padding: 16px 18px;
    font-size: 15.5px;
    line-height: 1.55;
    color: var(--text);
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.18s ease;
  }
  .option:hover {
    border-color: var(--accent);
    background: rgba(34, 211, 238, 0.07);
    box-shadow: 0 0 16px rgba(34, 211, 238, 0.15);
  }
  .option .k {
    display: inline-block;
    min-width: 26px; height: 26px;
    line-height: 26px;
    text-align: center;
    margin-right: 12px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    background: rgba(34, 211, 238, 0.1);
  }
  .option.picked {
    border-color: var(--accent);
    background: rgba(34, 211, 238, 0.12);
    box-shadow: 0 0 20px rgba(34, 211, 238, 0.25);
  }

  /* ---------- 结果页 ---------- */
  .result-head {
    text-align: center;
    margin-bottom: 24px;
  }
  .result-head .label {
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 3px;
    margin-bottom: 8px;
  }
  .result-head .big {
    font-size: clamp(28px, 7vw, 42px);
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #67e8f9, #a78bfa);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .badges {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin: 14px 0 6px;
  }
  .badge {
    font-size: 12.5px;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.05);
    color: var(--text);
  }
  .stars { color: #fbbf24; letter-spacing: 2px; font-size: 15px; }

  .match-bar {
    margin: 20px 0 6px;
  }
  .match-bar .row {
    display: flex;
    justify-content: space-between;
    font-size: 12.5px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .match-bar .track {
    height: 8px;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    overflow: hidden;
  }
  .match-bar .fill {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    box-shadow: 0 0 12px var(--glow);
    transition: width 0.8s cubic-bezier(.2,.7,.3,1);
  }

  .desc {
    margin: 20px 0;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.8;
  }
  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 24px;
  }
  .tag {
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 999px;
    color: #041018;
    background: linear-gradient(135deg, #67e8f9, #38bdf8);
    font-weight: 600;
  }

  .top3 { margin-top: 24px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 20px; }
  .top3 h3 {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 2px;
    margin-bottom: 14px;
    text-align: center;
  }
  .runner {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 12px;
    background: rgba(255,255,255,0.03);
    margin-bottom: 8px;
  }
  .runner .rank {
    width: 24px; height: 24px;
    line-height: 24px;
    text-align: center;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    background: rgba(34, 211, 238, 0.1);
  }
  .runner .nm { flex: 1; font-size: 15px; font-weight: 600; }
  .runner .el { font-size: 12px; color: var(--muted); }
  .actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 26px;
  }
</style>
</head>
<body>
<div id="app">

  <!-- 开始页 -->
  <section id="screen-start" class="screen active">
    <div class="card hero">
      <div class="mark">✦</div>
      <h1>共鸣者人格测试</h1>
      <p class="sub">回答 7 道题，找到与你灵魂共振的共鸣者。<br>基于《鸣潮》3.6 版本全共鸣者阵容。</p>
      <p class="meta">7 题 · 4 选 1 · 约 1 分钟</p>
      <button class="btn" onclick="startQuiz()">开始测试 →</button>
    </div>
  </section>

  <!-- 答题页 -->
  <section id="screen-quiz" class="screen">
    <div class="card">
      <div class="progress-head">
        <span>QUESTION <b id="q-cur">1</b> / 7</span>
        <span id="q-pct">14%</span>
      </div>
      <div class="bar"><div class="bar-fill" id="bar-fill" style="width:14%"></div></div>
      <div class="q-text" id="q-text"></div>
      <div class="options" id="q-options"></div>
    </div>
  </section>

  <!-- 结果页 -->
  <section id="screen-result" class="screen">
    <div class="card">
      <div class="result-head">
        <div class="label">你的共鸣者</div>
        <div class="big" id="r-name"></div>
        <div class="badges" id="r-badges"></div>
      </div>

      <div class="match-bar">
        <div class="row"><span>共鸣度</span><span id="r-score"></span></div>
        <div class="track"><div class="fill" id="r-fill" style="width:0%"></div></div>
      </div>

      <p class="desc" id="r-desc"></p>
      <div class="tags" id="r-tags"></div>

      <div class="top3">
        <h3>其他高共鸣</h3>
        <div id="r-top3"></div>
      </div>

      <div class="actions">
        <button class="btn" onclick="startQuiz()">重新测试</button>
      </div>
    </div>
  </section>

</div>

/* ============================================================
 * ③ 特质词表（可选参考，标签/选项 traits 都从这里面取，
 *    保证计分能正确匹配到角色）
 * ============================================================ */
const TRAITS = [
  "沉静","热血","自由","守护","理性","温柔","强势","叛逆",
  "忠诚","独立","神秘","优雅","活泼","坚毅","孤傲","直率","浪漫","智慧"
];

/* 元素配色（用于徽章） */
const ELEMENT_COLORS = {
  "气动": "#7ee787",
  "冷凝": "#7dd3fc",
  "导电": "#c4b5fd",
  "热熔": "#fb923c",
  "湮灭": "#f472b6",
  "衍射": "#fbbf24",
  "多属性": "#67e8f9"
};

/* ---------------- 测试逻辑 ---------------- */
let current = 0;
let answers = [];

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function startQuiz() {
  current = 0;
  answers = [];
  renderQuestion();
  showScreen("screen-quiz");
}

function renderQuestion() {
  const q = QUESTIONS[current];
  document.getElementById("q-cur").textContent = current + 1;
  document.getElementById("q-pct").textContent = Math.round((current / QUESTIONS.length) * 100) + "%";
  document.getElementById("bar-fill").style.width = ((current + 1) / QUESTIONS.length * 100) + "%";
  document.getElementById("q-text").textContent = q.question;

  const opts = document.getElementById("q-options");
  opts.innerHTML = "";
  const keys = ["A", "B", "C", "D"];
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.innerHTML = `<span class="k">${keys[i]}</span>${opt.text}`;
    btn.onclick = () => pick(i, btn);
    opts.appendChild(btn);
  });
}

function pick(i, btn) {
  if (btn.classList.contains("picked")) return;
  btn.classList.add("picked");
  answers.push(i);
  setTimeout(() => {
    if (current + 1 >= QUESTIONS.length) {
      renderResult();
    } else {
      current++;
      renderQuestion();
    }
  }, 240);
}

function calculate() {
  const scores = CHARACTERS.map(() => 0);
  answers.forEach((optIdx, qIdx) => {
    const opt = QUESTIONS[qIdx].options[optIdx];
    opt.traits.forEach(t => {
      CHARACTERS.forEach((c, ci) => {
        if (c.tags.includes(t)) scores[ci] += 1;
      });
    });
  });
  const ranked = scores
    .map((s, i) => ({ idx: i, score: s }))
    .sort((a, b) => b.score - a.score || CHARACTERS[b.idx].rarity - CHARACTERS[a.idx].rarity || a.idx - b.idx);
  return { scores, ranked };
}

function renderResult() {
  const { scores, ranked } = calculate();
  const top = CHARACTERS[ranked[0].idx];
  const topScore = ranked[0].score;
  const maxScore = Math.max(1, topScore);

  document.getElementById("r-name").textContent = top.name;

  // 徽章：元素 + 武器 + 星级
  const badges = document.getElementById("r-badges");
  const elColor = ELEMENT_COLORS[top.element] || "#9ca3af";
  const stars = "★".repeat(top.rarity) + "☆".repeat(5 - top.rarity);
  badges.innerHTML =
    `<span class="badge" style="color:${elColor};border-color:${elColor}55">${top.element}</span>` +
    `<span class="badge">${top.weapon}</span>` +
    `<span class="badge stars">${stars}</span>`;

  // 共鸣度
  const pct = Math.round(topScore / maxScore * 100);
  document.getElementById("r-score").textContent = `${topScore} / ${maxScore} 共鸣值`;
  document.getElementById("r-fill").style.width = pct + "%";

  document.getElementById("r-desc").textContent = top.desc;

  // 标签
  const tagsEl = document.getElementById("r-tags");
  tagsEl.innerHTML = top.tags.map(t => `<span class="tag">${t}</span>`).join("");

  // 其他高共鸣（top3）
  const top3El = document.getElementById("r-top3");
  top3El.innerHTML = ranked.slice(0, 3).map((r, i) => {
    const c = CHARACTERS[r.idx];
    const ec = ELEMENT_COLORS[c.element] || "#9ca3af";
    return `<div class="runner">
      <span class="rank">${i + 1}</span>
      <span class="nm">${c.name}</span>
      <span class="el" style="color:${ec}">${c.element}</span>
      <span class="el">${r.score} 共鸣</span>
    </div>`;
  }).join("");

  showScreen("screen-result");
}
</script>
